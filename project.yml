# Xcode 工程由 XcodeGen 生成，工程文件本身不入库 —— 避免 .pbxproj 的合并冲突。
#
#   brew install xcodegen && xcodegen generate
#
# 产品名尚未拍板（需求文档待决事项 1），下列标识符按仓库名取，定名后需同步修改：
#   - PRODUCT_BUNDLE_IDENTIFIER（两个 target）
#   - App Groups（两个 .entitlements 与 StoreConfiguration.shared）
#   - INFOPLIST_KEY_CFBundleDisplayName

name: CountdownPro
options:
  bundleIdPrefix: com.countdownpro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CountdownCore:
    path: Packages/CountdownCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CountdownPro:
    type: application
    platform: iOS
    sources:
      - CountdownPro
    dependencies:
      - package: CountdownCore
        product: CountdownKit
      - package: CountdownCore
        product: DesignTokens
      - package: CountdownCore
        product: CountdownStore
      - package: CountdownCore
        product: CountdownUI
      - target: CountdownWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownpro.app
        CODE_SIGN_ENTITLEMENTS: CountdownPro/CountdownPro.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 需求文档 6：不申请通讯录 / 位置 / 相册读取权限。
        # 仅需相册**写入**用于保存分享卡，且只在用户点「保存图片」时才请求。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "⟪待补文案：相册写入权限说明⟫"
        # 深浅色两套都必须支持，跟随系统。
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  CountdownWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CountdownWidgets
    dependencies:
      - package: CountdownCore
        product: CountdownKit
      - package: CountdownCore
        product: DesignTokens
      - package: CountdownCore
        product: CountdownStore
      - package: CountdownCore
        product: CountdownUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownpro.app.widgets
        CODE_SIGN_ENTITLEMENTS: CountdownWidgets/CountdownWidgets.entitlements
    info:
      path: CountdownWidgets/Info.plist
      properties:
        CFBundleDisplayName: "⟪待补文案：小组件 Bundle 显示名⟫"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
