# Xcode 工程由 XcodeGen 生成，工程文件本身不入库 —— 避免 .pbxproj 的合并冲突。
#
#   brew install xcodegen && xcodegen generate
#
# 产品名已定为「备考倒计时」，展示名两处都已填上。
#
# Bundle ID 与 App Group 仍然是 com.countdownpro.* —— **刻意不跟着改**：
# 它们不面向用户，而 App Group 一改，已装用户的小组件就读不到旧容器里的数据
# （表现为一夜之间全变回占位态）。要改只能在首个版本发布之前改，且三处一起改：
# 两个 .entitlements 与 StoreConfiguration.shared。

name: CountdownPro
options:
  bundleIdPrefix: com.countdownpro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CountdownCore:
    path: Packages/CountdownCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # GENERATE_INFOPLIST_FILE 靠这两个值填 CFBundleShortVersionString / CFBundleVersion。
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CountdownPro:
    type: application
    platform: iOS
    sources:
      - CountdownPro
    dependencies:
      - package: CountdownCore
        product: CountdownKit
      - package: CountdownCore
        product: DesignTokens
      - package: CountdownCore
        product: CountdownStore
      - package: CountdownCore
        product: CountdownUI
      - target: CountdownWidgets
        embed: true
    # 显式声明 scheme 并入库。
    # 不写的话要靠 Xcode 打开工程时"自动创建 scheme"补上 ——
    # 于是命令行 xcodebuild 在没人开过 Xcode 的机器上会直接报 scheme not found，
    # CI 上尤其如此。
    # 注意：testTargets 用的是 TestableTargetReference 语法，不是 dependencies 的
    # package/product 双键写法。包内测试 target 必须写成 "包名/target名"（带斜杠）——
    # 只写包名不带斜杠，xcodegen 2.46 会数组越界直接崩溃（trap）。
    scheme:
      testTargets:
        - package: CountdownCore/CountdownKitTests
        - package: CountdownCore/DesignTokensTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownpro.app
        CODE_SIGN_ENTITLEMENTS: CountdownPro/CountdownPro.entitlements
        # 下面所有 INFOPLIST_KEY_* 都**只在这一行为 YES 时生效**。
        # 缺了它，Xcode 既找不到现成的 Info.plist、也不会自动生成，
        # 签名阶段直接失败（报 "target does not have an Info.plist file"）。
        GENERATE_INFOPLIST_FILE: YES
        # 与 Strings.productName 必须一致。
        INFOPLIST_KEY_CFBundleDisplayName: "备考倒计时"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 需求文档 6：不申请通讯录 / 位置 / 相册读取权限。
        # 仅需相册**写入**用于保存分享卡，且只在用户点「保存图片」时才请求。
        # 草拟文案，待确认（见 DOCS/待补文案清单.md）。这一句会**原样**出现在系统弹窗上，
        # 留占位符等于让用户和审核员都看见 ⟪待补文案⟫，所以不能空着。
        # 措辞要对得上 .addOnly：只说写入，并明说不读取。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "保存分享卡到你的相册。只写入这一张图片，不读取相册里的任何内容。"
        # 深浅色两套都必须支持，跟随系统。
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  CountdownWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CountdownWidgets
    dependencies:
      - package: CountdownCore
        product: CountdownKit
      - package: CountdownCore
        product: DesignTokens
      - package: CountdownCore
        product: CountdownStore
      - package: CountdownCore
        product: CountdownUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownpro.app.widgets
        CODE_SIGN_ENTITLEMENTS: CountdownWidgets/CountdownWidgets.entitlements
    info:
      path: CountdownWidgets/Info.plist
      properties:
        # 小组件在"添加小组件"画廊里按这个名字归组，与 App 同名才找得到。
        CFBundleDisplayName: "备考倒计时"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
